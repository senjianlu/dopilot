# dopilot server example config.
#
# Copy to configs/server.toml and edit, or rely on DOPILOT_* environment
# overrides in Docker deployments.
# WARNING: every "change-me" value below is a placeholder and is NOT production-safe.
# Replace admin_password / token_secret / agent_token before any real deployment.
#
# Env overrides (phase 2.2): most scalars/secrets below can be overridden by a
# DOPILOT_* environment variable (env wins over TOML), so real deployments inject
# secrets without mounting a TOML — e.g. DOPILOT_ADMIN_PASSWORD,
# DOPILOT_ADMIN_API_TOKEN, DOPILOT_AGENT_TOKEN, DOPILOT_DATABASE_URL,
# DOPILOT_REDIS_URL, DOPILOT_SERVER_PORT, DOPILOT_SCHEDULER_ENABLED,
# DOPILOT_AUTH_DISABLED.
# EXCEPTION: token_secret is TOML-only (phase 2.2.2) — it has NO env override.
#
# Two separate tokens (phase 2.2.3) — admin auth and machine auth never mix:
#   - admin_api_token = externally supplied STATIC admin API token. Clients may
#                     present it directly as `Authorization: Bearer <token>` to
#                     authenticate as admin (no login). Set via TOML or
#                     DOPILOT_ADMIN_API_TOKEN. A non-empty value must be >= 16
#                     characters. It is ADMIN-ONLY: it is NEVER a source for the
#                     server<->agent machine token.
#   - [agents].agent_token = the agent machine token (below). Agents present it
#                     on outbound calls to the server (heartbeat + artifact/wheel
#                     fetch). No fallback from admin_api_token.
#   - token_secret  = internal HMAC signing key for login access tokens + SSE
#                     stream tokens. TOML-only, never sent to clients.
#
# Machine auth (phase 2.2.3) is config-present-or-off: it is ON iff
# [agents].agent_token is non-empty (a non-empty value must be >= 16 chars; set
# via DOPILOT_AGENT_TOKEN or the field). Leave it empty to disable machine auth.
# The old split tokens (DOPILOT_AGENT_SHARED_TOKEN / DOPILOT_SERVER_SHARED_TOKEN,
# [agent_auth].shared_token, [agents].server_shared_token) were removed and have
# NO effect.
#
# NOTE: token auth is NOT transport encryption. For encrypted cross-host traffic
# put the server, agents, and Redis on a private network / VPN, or terminate TLS
# at a reverse proxy. The token only proves identity over whatever transport you
# provide.
#
# Web admin auth is FAIL-CLOSED: the server refuses to start unless
# admin_username + admin_password + token_secret are all non-empty. To run
# anonymously in development, set DOPILOT_AUTH_DISABLED=true (do NOT do this in
# production).

[server]
host = "0.0.0.0"
port = 5000
public_url = "http://localhost:5000"
# Server-owned data root (phase 2.2.4). Anchors the auto-generated server<->agent
# token at <data_dir>/secrets/agent-token (see [agents].agent_token below).
# Distinct from logs/artifacts roots. Override with DOPILOT_SERVER_DATA_DIR.
data_dir = "/server-data"

[database]
url = "postgresql+psycopg://dopilot:dopilot@localhost:5432/dopilot"

[auth]
admin_username = "admin"
admin_password = "change-me"
# Internal signing key (TOML-only, no env override). This example value is
# public; replace with your own long random value before any real deployment.
token_secret = "shLv5qNwC3aViZQYr08x3yfaY6yGZACB6ujydXiVaGnb7OdOflc91xVLyXBoeRDL"
# Static admin API token: usable directly as `Authorization: Bearer <token>`.
# Admin-only (phase 2.2.3) — it is NOT a source for [agents].agent_token. Leave
# empty to disable it; a non-empty value must be >= 16 chars. Override with
# DOPILOT_ADMIN_API_TOKEN.
admin_api_token = "change-me-admin-api-token"
access_token_ttl_minutes = 720
stream_token_ttl_seconds = 60

# Redis Streams transport (phase 1.5). Redis is a message bus, not a database.
[redis]
url = "redis://localhost:6379/0"
stream_maxlen_commands = 100000
stream_maxlen_events = 100000
# Resource caps: the log stream dominates Redis memory. 100_000 entries hold a
# bounded working set; the retention sweep additionally XTRIMs by time (below).
stream_maxlen_logs = 100000
# Time bound for the log stream (seconds), enforced as a periodic XTRIM MINID by
# the retention sweep. 0 disables the time trim (MAXLEN still applies).
log_retention_seconds = 86400
# Log-flood guard: BYTE budget for the log stream (MAXLEN counts entries; at
# 256KB/entry it bounds nothing). StreamGuardLoop measures MEMORY USAGE every
# stream_guard_interval_seconds and XTRIMs back under the budget (clears the
# stream if it will not converge). 0 disables. (256MB)
stream_max_bytes_logs = 268435456
stream_guard_interval_seconds = 30
# Log-flood guard: re-dispatch "sent" commands whose message vanished from the
# agent command stream (stream cleared / Redis volume wiped), checked at start
# and every interval, only for rows older than min_age. 0 interval disables.
sent_reconcile_interval_seconds = 300
sent_reconcile_min_age_seconds = 60
# OOM guard: max "sent" rows examined per reconcile call (keyset-paged sweep
# with a frozen per-sweep boundary; coverage is unaffected, only paced).
sent_reconcile_batch_limit = 500
consumer_name = "server-1"
require_aof = true

[agents]
# Agent health = now - nodes.last_seen_at <= heartbeat_timeout_seconds.
heartbeat_timeout_seconds = 30
stalled_attempt_seconds = 300
# Reclaim an attempt this many seconds after its last event. Agents re-emit an
# attempt.heartbeat (default every 60s) while they can confirm the process is
# alive, so this bounds "agent online but liveness unconfirmable" -- it is NOT
# a task runtime cap. Keep it well above the agent's
# attempt_heartbeat_interval_seconds.
lost_after_stalled_seconds = 3600
# No-progress detection. Answers the question the heartbeat cannot: scrapyd
# keeps listing a spider wedged in its shutdown, so an attempt can look alive
# for hours while doing nothing -- and hold its schedule's concurrency slot the
# whole time. Here the signal is the job log's size: alive but not growing.
#
# Alert-only by default. It never marks an attempt lost and never touches the
# reclaim path above, so a false positive costs you one notification.
#
# no_progress_stall_seconds: idle time before alerting. 0 disables the feature.
#   Set it FAR above your slowest healthy run -- a run cut short for being quiet
#   is indistinguishable from a real failure, and repeated failures auto-disable
#   the schedule.
no_progress_stall_seconds = 1800
# no_progress_sample_max_age_seconds: how recent the agent's last log-size
#   reading must be for a verdict to mean anything. Once readings stop arriving
#   we are blind rather than watching a stall, and blind must stay silent.
no_progress_sample_max_age_seconds = 300
# auto_stop_on_no_progress: opt-in. false only notifies you; true actually
#   cancels the task (TERM, then KILL, then confirmation). Run it in
#   alert-only mode for a while first and check what it would have killed.
auto_stop_on_no_progress = false
# The single server<->agent machine token (phase 2.2.3). It MUST match the
# agent's [agent].agent_token. The agent presents it on its outbound calls
# (agent -> server heartbeat + artifact/wheel fetch) and the server validates
# them; there is no server -> agent HTTP direction (phase 2.2.7). A non-empty
# value must be >= 16 chars; set via DOPILOT_AGENT_TOKEN or this field.
#
# Phase 2.2.4: leave this EMPTY (and unset DOPILOT_AGENT_TOKEN) to let the server
# auto-generate + persist a strong token under [server].data_dir on first start
# (/server-data/secrets/agent-token), reused on restart. Retrieve it with
# `dopilot-server agent-token print` and set it on every agent. Generation is
# server-only; `load_settings()` never creates this file (it is a runtime step).
agent_token = "change-me-agent-token"

[nodes]
# Liveness comes from agent heartbeats, not a configured endpoint list (nodes
# appear only once an agent heartbeats in), so leave this empty. The agent is
# outbound-only (phase 2.2.7) — the server never dials an agent endpoint.
agents = []

[scheduler]
enabled = true
timezone = "Asia/Shanghai"
# Auto-disable (log-flood guard): a schedule whose last N recorded outcomes are
# all erroneous (failed/lost, finished with scrapy ERRORs, truncated/flooded
# log) is switched off and a notification is raised. 0 disables.
auto_disable_after_errors = 5
# A soft "lost" task is only recorded as an outcome after reclaim + drain, or
# after this many seconds as a bounded fallback.
lost_outcome_grace_seconds = 86400

[logs]
root_dir = "/server-data/logs"
background_drain_interval_seconds = 30
realtime_drain_interval_seconds = 1
max_tail_bytes_per_pull = 262144
eof_stable_seconds = 3
final_drain_hard_timeout_seconds = 30
# Phase 1.5: bounded drain window after a terminal event before finalize+cleanup.
log_drain_timeout_seconds = 30
# Days a terminal task's logs+rows are retained before the automatic sweep
# deletes them (also the manual maintenance API default cutoff).
retention_days = 30
# Log-flood guard: per-execution log-file size hard cap in bytes (32MiB, matches
# the agent's max_job_log_bytes). Past this the consumer keeps consuming/ACKing
# but stops appending body bytes, writes one truncation marker, sets
# log_integrity='truncated' and tells the agent to stop tailing. 0 disables.
max_file_bytes = 33554432
# Log-flood guard: aggregate logs-directory budget (20GB). Increments that would
# exceed it are not written (DB state only); the sweep evicts the oldest sealed
# terminal logs to make room. 0 disables.
max_total_bytes = 21474836480

# Resource caps: automatic retention sweep. A background loop enforces
# logs.retention_days, prunes event_audit, and XTRIMs the Redis log/event streams
# by time — no operator action needed. Set enabled=false to rely on the manual
# maintenance API only.
[maintenance]
enabled = true
sweep_interval_seconds = 3600
event_audit_retention_days = 30
event_audit_delete_batch = 5000
# OOM guard: resolved (sent/failed/canceled) command-outbox rows of settled
# tasks are pruned after this many days (0 disables). Reclaim rows, in-flight
# rows and active/lost tasks' rows are never pruned here.
outbox_retention_days = 7
outbox_delete_batch = 5000
# Log-flood guard: delete command streams of retired agent ids (no node /
# soft-deleted / heartbeat older than this) once this many days old. 0 disables.
stale_command_stream_days = 7
# Notification center bounds: read rows past retention, unread rows past
# unread_max_days, and a hard row cap (oldest evicted first). 0 disables each.
notification_retention_days = 30
notification_unread_max_days = 90
notification_max_rows = 2000
# Resource dashboard: how often the /maintenance page's usage snapshot (server
# disk / PostgreSQL / Redis / per-agent) is sampled, in seconds. The endpoint
# serves this cached snapshot only (never samples on the request path).
# 0 disables the sampler (the page then shows "not sampled yet").
stats_interval_seconds = 60

[artifacts]
root_dir = "/server-data/artifacts"
# Resource caps: reject a single upload larger than this (HTTP 413), read in
# bounded chunks so RAM/disk stay bounded (200MiB). 0 disables.
max_upload_bytes = 209715200
# Resource caps: reject new uploads once the stored artifact total would exceed
# this (HTTP 507). Archived artifacts are never auto-deleted, so this bounds
# aggregate growth by refusing new uploads (20GiB). 0 disables.
max_total_bytes = 21474836480

[i18n]
locale = "zh"
timezone = "Asia/Shanghai"
