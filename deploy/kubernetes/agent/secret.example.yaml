# Example Secret for the dopilot agent join manifest. COPY, fill in real values,
# and apply SEPARATELY — do NOT commit the filled-in copy.
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with the real token + redis url
#   kubectl apply -f secret.yaml
#
# Or create it imperatively without a file on disk at all (preferred — nothing to
# accidentally commit):
#   kubectl -n dopilot create secret generic dopilot-agent \
#     --from-literal=agent-token='<server-agent-token>' \
#     --from-literal=redis-url='redis://:<redis-pass>@<server-host>:6379/0'
#
# Retrieve the agent token on the SERVER host (it must match the server's token):
#   docker compose -f docker-compose.server.yml exec server \
#     dopilot-server agent-token print
# A non-empty token must be >= 16 characters. Agents NEVER get the admin token.
apiVersion: v1
kind: Secret
metadata:
  name: dopilot-agent
  namespace: dopilot
type: Opaque
stringData:
  # The single server<->agent machine token — MUST equal the server's token.
  agent-token: "<server-agent-token>"
  # Full Redis URL of the server's Redis. Token auth is NOT transport encryption:
  # keep this link on a private network / VPN or terminate TLS at a proxy.
  redis-url: "redis://:<redis-pass>@<server-host>:6379/0"
